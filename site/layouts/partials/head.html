<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.tagline }}{{ end }}">
<title>{{ if .IsHome }}{{ .Site.Params.productName }}{{ else }}{{ .Title }} &middot; {{ .Site.Params.productName }}{{ end }}</title>
<link rel="canonical" href="{{ .Permalink }}">
{{ $alt := .OutputFormats.Get "llms" }}
{{ with $alt }}<link rel="alternate" type="{{ .MediaType.Type }}" href="{{ .Permalink }}">{{ end }}
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
