<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: transparent; }
  .box { display: inline-block; }
</style>
</head>
<body>

<!-- Web Icons -->
<!-- 16x16: only ring -->
<div id="favicon-16" class="box" style="width: 16px; height: 16px; background: transparent; color: #9A3B1E;">
  <svg viewBox="0 0 400 400" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="80" stroke-linecap="round" d="M 300 120 A 150 150 0 1 0 334 296"></path></svg>
</div>

<!-- 32x32 -->
<div id="favicon-32" class="box" style="width: 32px; height: 32px; background: transparent; color: #9A3B1E;">
  <svg viewBox="0 0 400 400" width="32" height="32"><path fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round" d="M 312 110 A 150 150 0 1 0 334 296"></path><rect x="312" y="120" width="60" height="230" rx="30" fill="currentColor"></rect></svg>
</div>

<!-- apple-touch-icon (180x180), icon-192, icon-512, icon.png (1024x1024) -->
<!-- We can scale this using CSS by setting the container size -->
<div id="app-icon" class="box" style="width: 1024px; height: 1024px; background: #9A3B1E; color: #F6F3EC; display: flex; align-items: center; justify-content: center;">
  <svg viewBox="0 0 400 400" width="742" height="742"><path fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" d="M 322 100 A 150 150 0 1 0 334 296"></path><rect x="322" y="118" width="38" height="232" rx="19" fill="currentColor"></rect></svg>
</div>

<!-- Mobile adaptive icon (1024x1024, transparent background, bot 820px wide offset 179 from top) -->
<!-- Wait, for the "bot", the prompt says "the bot is 820 pixels wide". Now it's a mark, so maybe the mark is 820 pixels wide? Let's assume the mark should be 820x820. -->
<div id="adaptive-icon" class="box" style="width: 1024px; height: 1024px; background: transparent; color: #F6F3EC; position: relative;">
  <div style="position: absolute; top: 102px; left: 102px; width: 820px; height: 820px;">
    <svg viewBox="0 0 400 400" width="100%" height="100%"><path fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" d="M 322 100 A 150 150 0 1 0 334 296"></path><rect x="322" y="118" width="38" height="232" rx="19" fill="currentColor"></rect></svg>
  </div>
</div>

<!-- Mobile monochrome icon (1024x1024, transparent background, white mark) -->
<div id="monochrome-icon" class="box" style="width: 1024px; height: 1024px; background: transparent; color: #FFFFFF; position: relative;">
  <div style="position: absolute; top: 102px; left: 102px; width: 820px; height: 820px;">
    <svg viewBox="0 0 400 400" width="100%" height="100%"><path fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" d="M 322 100 A 150 150 0 1 0 334 296"></path><rect x="322" y="118" width="38" height="232" rx="19" fill="currentColor"></rect></svg>
  </div>
</div>

<!-- Mobile icon-background (1024x1024, opaque dark background) -->
<div id="icon-background" class="box" style="width: 1024px; height: 1024px; background: #0B0C0E;"></div>

<!-- Mobile notification icon (96x96 transparent monochrome) -->
<div id="notification-icon" class="box" style="width: 96px; height: 96px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
  <svg viewBox="0 0 400 400" width="70" height="70"><path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" d="M 322 100 A 150 150 0 1 0 334 296"></path><rect x="322" y="118" width="40" height="232" rx="20" fill="currentColor"></rect></svg>
</div>

</body>
</html>
