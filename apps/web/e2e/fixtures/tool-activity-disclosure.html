<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool activity disclosure</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h } from "react";
      import { createRoot } from "react-dom/client";
      import { CompactWorkRecord } from "../../src/components/ai/CompactWorkRecord";
      import "../../src/styles.css";

      const live = new URLSearchParams(location.search).get("live") === "1";
      // Live: an in-flight activity beat. Complete: only the finished step
      // summary remains — a real completed run carries no pending progress.
      const blocks = live
        ? [
            {
              kind: "progress",
              text: "Checking calendar...",
              activity: true,
            },
          ]
        : [
            {
              kind: "steps",
              steps: [{ label: "Google Calendar", count: 1 }],
              durationMs: 400,
            },
          ];

      const record = h(CompactWorkRecord, { blocks });
      const response = h(
        "div",
        { "data-testid": "response" },
        live ? "Opening the terminal now…" : "Terminal is open and ready.",
      );

      const content = h("div", { className: "flex flex-col gap-2" }, record, response);

      const bubble = h(
        "div",
        {
          className:
            "max-w-[74%] space-y-2.5 rounded-[20px] bg-[#1A1A1D] px-[18px] py-3 text-[15.5px] leading-[1.5] text-[#DFDFE2]",
        },
        content,
      );

      createRoot(document.getElementById("root")).render(
        h(
          "main",
          {
            className:
              "flex min-h-screen items-end bg-[#101012] px-4 py-6 md:px-8 md:py-8",
          },
          h("div", { className: "flex w-full justify-start" }, bubble),
        ),
      );
    </script>
  </body>
</html>
