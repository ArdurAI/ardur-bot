name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Version and platform
      placeholder: "e.g. dev @ abc1234, macOS 15 (arm64), desktop app"
    validations:
      required: true
  - type: input
    attributes:
      label: Provider and computer
      placeholder: "e.g. openai-codex / xhigh, Docker computer"
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Remove anything private before pasting.
