name: Feature request
description: Something Ardur Bot should do.
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
  - type: input
    attributes:
      label: Comparable behaviour elsewhere
      placeholder: "e.g. how Grok Bot or another tool handles it"
