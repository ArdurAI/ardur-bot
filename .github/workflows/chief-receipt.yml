name: Chief receipt acceptance
on:
  pull_request:
    branches: [dev]
    paths:
      - 'packages/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/chief-receipt.yml'
permissions:
  contents: read
env:
  # #199: Browser harnesses use the public Postgres mirror too.
  ARDUR_TEST_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:16-alpine
  # #199: Hosted runners are disposable; do not pull the Ryuk reaper.
  TESTCONTAINERS_RYUK_DISABLED: 'true'
jobs:
  journey:
    name: Chief receipt Postgres journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # #199: Avoid anonymous Docker Hub pulls for the service container.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: chief_receipt_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTKIT_SKIP_ROOT_ENV: '1'
      DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/chief_receipt_fixture
      VERIFY_DATABASE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm exec vitest run packages/testkit/src/chief-loop.postgres.test.ts packages/adapters/src/bot-comms.postgres.test.ts --maxWorkers=2 --silent=false --reporter=verbose
      - run: pnpm exec vitest run packages/testkit/src/chief-corrections.postgres.test.ts --maxWorkers=2 --silent=false --reporter=verbose
  browser:
    name: Chief receipt visible-paint journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTKIT_SKIP_ROOT_ENV: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ardurbot/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e --workers=1 --spec=chief-receipt.spec.ts
      - run: pnpm test:e2e --workers=1 --spec=chief-activity.spec.ts
      - run: pnpm test:e2e --workers=1 --spec=coordination-line.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chief-receipt-screenshots
          path: apps/web/test-results
          if-no-files-found: ignore
  bundle:
    name: Chief receipt initial bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir baseline install --frozen-lockfile
      - run: pnpm --dir baseline --filter @ardurbot/web build
      - run: pnpm --filter @ardurbot/web build
      - name: Compare initial gzip against the exact dev base
        run: |
          node --input-type=module -e '
          import { measureBundle } from "./scripts/bundle-budget.mjs";
          const base = await measureBundle("baseline/apps/web/dist");
          const candidate = await measureBundle("apps/web/dist");
          const increase = candidate.initial.gzipBytes - base.initial.gzipBytes;
          console.log(JSON.stringify({ baseInitialGzipBytes: base.initial.gzipBytes, candidateInitialGzipBytes: candidate.initial.gzipBytes, increaseBytes: increase, allowedIncreaseBytes: 1024 }));
          if (increase > 1024) process.exitCode = 1;
          '
