name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package from dev
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  validate:
    name: Validate preview tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing tag on dev
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/dev
          git checkout --detach "$sha"
          version="$(node scripts/desktop-release.mjs validate "$RELEASE_TAG")"
          {
            echo "tag=$RELEASE_TAG"
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Unsigned ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15, platform: mac, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, optional: true }
          - { os: windows-2022, platform: win, arch: x64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Signing discovery is disabled; mac.notarize=false explicitly skips notarization.
      # No signing/notarization credentials are passed into these unsigned builds.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build renderer and main process
        run: pnpm --filter @ardurbot/web build && pnpm --filter @ardurbot/desktop build
      - name: Package without signing or publishing
        run: pnpm --filter @ardurbot/desktop exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Report unavailable optional ARM Linux toolchain
        if: failure() && matrix.optional
        run: echo "::warning title=Linux arm64::ARM Linux packaging failed; the preview will contain the required platforms only. Inspect this job before claiming ARM Linux support."
      - name: Upload installers and channel metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
            apps/desktop/out/*.exe
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest*.yml

  publish:
    name: Publish unsigned pre-release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release-artifacts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Validate assets, merge macOS feeds, and generate the tap cask
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/desktop-release-assets.mjs "$RELEASE_VERSION" release-artifacts release-ready
      - name: Generate private-detail-free notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop-release.mjs notes "$RELEASE_TAG" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-ready/* --verify-tag --target "$RELEASE_SHA" --draft --prerelease --latest=false --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
