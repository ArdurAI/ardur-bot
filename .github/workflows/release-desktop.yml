name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package from dev
        required: true
        type: string
      evidence_waiver:
        description: >-
          Reason to publish this preview without measured performance evidence. One plain
          sentence: letters, numbers, spaces, and . , ; : ' " ( ) ! ? & % + - only. No slash,
          "www." host, ://scheme, or email address.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  validate:
    name: Validate preview tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      parent: ${{ steps.release.outputs.parent }}
      fixed_release: ${{ steps.release.outputs.fixed_release }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Decide macOS signing once
        id: signing
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          signed=false
          if [[ -n "$MAC_CERTIFICATE_P12" && -n "$MAC_CERTIFICATE_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            signed=true
          fi
          printf 'signed=%s\n' "$signed" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing tag on dev
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/dev
          git checkout --detach "$sha"
          version="$(node scripts/desktop-release.mjs validate "$RELEASE_TAG")"
          parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
          if [[ ! "$parent" =~ ^[0-9a-f]{40}$ ]]; then parent=""; fi
          fixed_sha=""
          # --first-parent follows only the first parent of a merge, so a tag on a
          # merged side branch is not the previous desktop release.
          # https://git-scm.com/docs/git-describe#Documentation/git-describe.txt---first-parent
          fixed_tag="$(git describe --tags --abbrev=0 --match 'v*' --first-parent "${sha}^" 2>/dev/null || true)"
          if [[ -n "$fixed_tag" ]]; then
            fixed_sha="$(git rev-parse "${fixed_tag}^{commit}" 2>/dev/null || true)"
            if [[ ! "$fixed_sha" =~ ^[0-9a-f]{40}$ ]]; then fixed_sha=""; fi
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "sha=$sha"
            echo "version=$version"
            echo "parent=$parent"
            echo "fixed_release=$fixed_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform == 'mac' && needs.validate.outputs.signed == 'true' && 'Signed' || 'Unsigned' }} ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac, arch: arm64, nodePlatform: darwin }
          - { os: macos-15, platform: mac, arch: x64, nodePlatform: darwin }
          - { os: ubuntu-24.04, platform: linux, arch: x64, nodePlatform: linux }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, optional: true, nodePlatform: linux }
          - { os: windows-2022, platform: win, arch: x64, nodePlatform: win32 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_KEYCHAIN: ${{ matrix.platform == 'mac' && needs.validate.outputs.signed == 'true' && format('{0}/ardur-signing-{1}-{2}-{3}.keychain-db', runner.temp, github.run_id, github.run_attempt, matrix.arch) || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install optional packages for this architecture
        # pnpm 9 reads pnpm.supportedArchitectures from the root package.json, including
        # an architecture that is not the runner's. The macOS x64 job runs on arm64.
        # https://pnpm.io/settings#supportedarchitectures
        run: node apps/desktop/scripts/select-supported-architectures.mjs --os ${{ matrix.nodePlatform }} --cpu ${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm db:generate
      # The desktop build also bundles the API, worker, and SQL migrator.
      - name: Build renderer and main process
        run: pnpm --filter @ardurbot/web build && pnpm --filter @ardurbot/desktop build
      # electron-builder's beforePack hook stages this architecture's embedded Postgres.
      - name: Package preview without an identified developer or publishing
        if: matrix.platform != 'mac' || needs.validate.outputs.signed != 'true'
        run: pnpm --filter @ardurbot/desktop exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Import Developer ID into a temporary keychain
        if: matrix.platform == 'mac' && needs.validate.outputs.signed == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/ardur-signing-${{ matrix.arch }}.p12"
          umask 077
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ardur-signing-${{ matrix.arch }}.p12").write_bytes(base64.b64decode(os.environ["MAC_CERTIFICATE_P12"], validate=True))'
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$CSC_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CSC_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CSC_KEYCHAIN"
          security import "$certificate" -k "$CSC_KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$CSC_KEYCHAIN" >/dev/null
          rm -f "$certificate"
      - name: Package with Developer ID and notarize
        if: matrix.platform == 'mac' && needs.validate.outputs.signed == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @ardurbot/desktop exec electron-builder --mac --${{ matrix.arch }} --config scripts/signed-mac-config.mjs --publish never
      - name: Delete the temporary signing keychain
        if: always() && matrix.platform == 'mac' && needs.validate.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$CSC_KEYCHAIN" ]]; then security delete-keychain "$CSC_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/ardur-signing-${{ matrix.arch }}.p12"
      - name: Report unavailable optional ARM Linux toolchain
        if: failure() && matrix.optional
        run: echo "::warning title=Linux arm64::ARM Linux packaging failed; the preview will contain the required platforms only. Inspect this job before claiming ARM Linux support."
      - name: Record the built artifact's signing mode
        # A failed package step cannot produce a signing record.
        shell: bash
        env:
          SIGNED: ${{ matrix.platform == 'mac' && needs.validate.outputs.signed == 'true' }}
        run: printf '{"signed":%s}\n' "$SIGNED" > apps/desktop/out/install-build-${{ matrix.platform }}-${{ matrix.arch }}.json
      - name: Upload installers and channel metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
            apps/desktop/out/*.exe
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest*.yml
            apps/desktop/out/install-build-*.json

  install-acceptance:
    name: Install ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15, platform: mac, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64, debArch: amd64, imageArch: x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, debArch: arm64, imageArch: arm64, optional: true }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: installers
      - name: Install and open the quarantined DMG and Homebrew command
        if: matrix.platform == 'mac'
        env:
          ARDUR_INSTALL_LOG_DIR: ${{ runner.temp }}/install-acceptance
        run: bash scripts/release/install-acceptance-mac.sh installers/ardur-${{ needs.validate.outputs.version }}-mac-${{ matrix.arch }}.dmg
      - name: Install deb on clean Ubuntu and open under Xvfb
        if: matrix.platform == 'linux'
        env:
          ARDUR_INSTALL_LOG_DIR: ${{ runner.temp }}/install-acceptance
        run: bash scripts/release/install-acceptance-linux.sh installers/ardur-${{ needs.validate.outputs.version }}-linux-${{ matrix.debArch }}.deb
      - name: Install AppImage on clean Ubuntu and open under Xvfb
        if: ${{ !cancelled() && matrix.platform == 'linux' }}
        env:
          ARDUR_INSTALL_LOG_DIR: ${{ runner.temp }}/install-acceptance
        run: bash scripts/release/install-acceptance-linux.sh installers/ardur-${{ needs.validate.outputs.version }}-linux-${{ matrix.imageArch }}.AppImage
      - name: Upload install logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/install-acceptance
          if-no-files-found: warn

  evidence:
    name: Require validated scoreboard evidence
    needs: [validate, build]
    uses: ./.github/workflows/performance.yml
    with:
      candidate_sha: ${{ needs.validate.outputs.sha }}
      base_sha: ${{ needs.validate.outputs.parent }}
      fixed_release_sha: ${{ needs.validate.outputs.fixed_release }}
      environment: release-packaged
      gate: required
      release_version: ${{ needs.validate.outputs.version }}
      evidence_waiver: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_waiver || '' }}
      mac_signed: ${{ needs.validate.outputs.signed == 'true' }}

  publish:
    name: Publish ${{ needs.validate.outputs.signed == 'true' && 'signed macOS' || 'unsigned' }} pre-release
    needs: [validate, build, evidence]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scoreboard-publication
          path: publication
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Render notes from the validated scoreboard and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_SIGNED: ${{ needs.validate.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop-release.mjs notes "$RELEASE_TAG" publication/scoreboard-publication/gate.json "$RELEASE_SIGNED" > release-notes.md
          node scripts/scoreboard-index.mjs verify-publication --directory publication/release-ready --gate publication/scoreboard-publication/gate.json
          mapfile -t upload_files < <(node scripts/scoreboard-index.mjs list-upload --directory publication/release-ready)
          [[ "${#upload_files[@]}" -gt 0 ]]
          node scripts/release-publish.mjs --tag "$RELEASE_TAG" --target "$RELEASE_SHA" --notes release-notes.md --waiver-record publication/scoreboard-publication/waiver-record.json --signed "$RELEASE_SIGNED" --signing-record publication/scoreboard-publication/signing.json -- "${upload_files[@]}"
