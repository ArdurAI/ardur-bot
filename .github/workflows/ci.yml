name: ci
on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  computer-profiles:
    name: Computer image profiles (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sandbox:build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://ardurbot:ardurbot@127.0.0.1:5433/ardurbot
      - run: pnpm check
      - run: pnpm site:facts:check

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://ardurbot:ardurbot@127.0.0.1:5433/ardurbot
          BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
      - name: Bundled API and worker on an embedded database
        run: node apps/desktop/scripts/service-bundle-smoke.mjs
        env:
          ARDURBOT_SMOKE_EMBEDDED: "1"
      - name: Electron smoke
        run: xvfb-run --auto-servernum pnpm --filter @ardurbot/desktop exec playwright test --config e2e/playwright.config.ts
      - name: Upload desktop setup screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-screenshots
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://ardurbot:ardurbot@127.0.0.1:5433/ardurbot
      - run: pnpm test

  test-integration:
    name: Postgres journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-web-e2e:
    name: Web e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ardurbot/web exec playwright install --with-deps chromium
      - name: Run Web e2e
        run: pnpm test:e2e --workers=2 --shard=${{ matrix.shard }}
      - name: Upload web e2e screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-screenshots-${{ strategy.job-index }}
          path: |
            apps/web/test-results
            playwright-report
          if-no-files-found: ignore

  publish-site-assets:
    name: Publish website facts and screenshots
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [computer-profiles, lint, check, build, test, test-integration, test-web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: site-assets-${{ github.repository }}
      cancel-in-progress: false
    env:
      SITE_SCREENSHOTS_DIR: /tmp/site-screenshots-${{ github.run_id }}
      SITE_ASSETS_STAGE: /tmp/site-assets-stage-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://ardurbot:ardurbot@127.0.0.1:5433/ardurbot
      - run: pnpm site:facts:check
      - name: Install Playwright Chromium
        run: pnpm --filter @ardurbot/web exec playwright install --with-deps chromium
      - name: Capture product screenshots
        run: pnpm test:e2e --spec=site-screenshots.spec.ts --workers=1
      - name: Compare website assets
        id: assets
        run: node --import tsx scripts/site-assets-prepare.ts
      - name: Publish changed assets
        if: steps.assets.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git switch --orphan site-assets-publish
          # switch --orphan already empties the index; clear same-named build leftovers before copying.
          rm -rf product.json screenshots media
          cp "${SITE_ASSETS_STAGE}/product.json" product.json
          cp -R "${SITE_ASSETS_STAGE}/screenshots" screenshots
          if [ -d "${SITE_ASSETS_STAGE}/media" ]; then cp -R "${SITE_ASSETS_STAGE}/media" media; fi
          git add product.json screenshots
          if [ -d media ]; then git add media; fi
          git -c commit.gpgsign=false -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish site assets'
          git push --force origin HEAD:refs/heads/site-assets
          echo "- Published orphan commit: $(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
